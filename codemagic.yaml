workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    # اسم المفتاح زي ما هو ظاهر في Teams > Integrations > Developer Portal
    integrations:
      app_store_connect: codemagic

    environment:
      node: 22
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.unityClinics.app

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.unityClinics.app"
        API_URL: "https://api.unity-clinics.cyou"
        NUXT_PUBLIC_ENV: "production"

    scripts:
      - name: Enable pnpm and check environment
        script: |
          corepack enable
          corepack prepare pnpm@latest --activate
          node --version
          pnpm --version

      - name: Export environment variables
        script: |
          echo "API_URL=$API_URL" > apps/mob-app/.env
          echo "NODE_ENV=production" >> apps/mob-app/.env
          echo "NUXT_PUBLIC_ENV=$NUXT_PUBLIC_ENV" >> apps/mob-app/.env

      - name: Install dependencies
        script: |
          pnpm install --frozen-lockfile

      - name: Build Nuxt web assets
        script: |
          pnpm --filter @unity/mob-app generate

      - name: Sync Capacitor iOS
        script: |
          if [ ! -d "ios" ]; then
            pnpm exec cap add ios
          fi
          pnpm exec cap sync ios

      - name: Install CocoaPods (only if Podfile exists)
        script: |
          cd ios/App
          echo "=== ios/App contents ==="
          ls -la
          if [ -f Podfile ]; then
            echo "Podfile found - running pod install"
            pod install
          else
            echo "No Podfile - project uses Swift Package Manager, skipping pod install"
          fi

      - name: Configure iOS entitlements and resources
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          gem install xcodeproj
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("App.xcodeproj")
            target = project.targets.first
            app_group = project.main_group.find_subpath("App", true)
            file_name = "GoogleService-Info.plist"
            if File.exist?(File.join("App", file_name))
              file_ref = app_group.find_file_by_path(file_name) || app_group.new_file(file_name)
              unless target.resources_build_phase.files_references.include?(file_ref)
                target.resources_build_phase.add_file_reference(file_ref)
              end
            end
            project.targets.each do |t|
              t.build_configurations.each do |config|
                config.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
              end
            end
            project.save

            if File.exist?("Pods/Pods.xcodeproj")
              pods_project = Xcodeproj::Project.open("Pods/Pods.xcodeproj")
              pods_project.targets.each do |t|
                t.build_configurations.each do |config|
                  if ENV["DEVELOPMENT_TEAM"]
                    config.build_settings["DEVELOPMENT_TEAM"] = ENV["DEVELOPMENT_TEAM"]
                  end
                  if t.respond_to?(:product_type) && t.product_type == "com.apple.product-type.bundle"
                    config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                    config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                    config.build_settings["CODE_SIGN_IDENTITY"] = ""
                  end
                end
              end
              pods_project.save
            end
          '

      - name: Set up code signing
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Create export options plist
        script: |
          PROFILE_NAME=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | plutil -extract Name raw - 2>/dev/null || echo "")
          echo "=== Profile Name: $PROFILE_NAME ==="

          cat > $HOME/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.unityClinics.app</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "=== Export options ==="
          cat $HOME/export_options.plist

      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          BUILD_NUMBER=$(($(date +%s)))
          echo "Setting build number to: $BUILD_NUMBER"
          agvtool new-version -all $BUILD_NUMBER

      - name: Build archive
        script: |
          # لو فيه workspace (CocoaPods) استخدمه، غير كده استخدم الـ project (Swift Package Manager)
          if [ -d "$CM_BUILD_DIR/$XCODE_WORKSPACE" ]; then
            echo "Using workspace: $XCODE_WORKSPACE"
            TARGET=(-workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE")
          else
            echo "Using project: $XCODE_PROJECT"
            TARGET=(-project "$CM_BUILD_DIR/$XCODE_PROJECT")
          fi

          xcodebuild "${TARGET[@]}" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportOptionsPlist "$HOME/export_options.plist" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true